# =============================================================================
# CD Workflow: Deploy to INT Environment
# =============================================================================
#
# This workflow deploys CVAT to the INT (Integration) environment.
# It is triggered MANUALLY via workflow_dispatch.
#
# Usage:
#   1. Go to Actions tab in GitHub
#   2. Select "Deploy to INT" workflow
#   3. Click "Run workflow"
#   4. Enter the image tag to deploy (e.g., "sst-main-abc1234" or "feature-auth-xyz999")
#   5. Click "Run workflow" button
#
# Prerequisites (GitHub Secrets):
#   - GCP_SA_KEY:      Service Account JSON key
#   - GCP_PROJECT_ID:  GCP Project ID (sandbox-446907)
#   - GCP_ZONE:        VM zone (us-central1-a)
#   - INT_VM_NAME:     INT VM instance name
#   - INT_CVAT_HOST:   CVAT hostname for INT (e.g., cvat-ci-1.smartsurgerytek.net)
#
# =============================================================================

name: Deploy to INT

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g., sst-main-abc1234)'
        required: true
        type: string
      skip_backup:
        description: 'Skip backup before deployment'
        required: false
        type: boolean
        default: false

env:
  # GCP Configuration
  GCP_REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPO_NAME: cvat-repo

  # Deployment Configuration
  DEPLOY_PATH: sst-cvat  # Directory name under $HOME on VM
  GIT_REPO_URL: https://github.com/smartsurgerytek/sst-cvat.git
  GIT_BRANCH: sst-main

jobs:
  deploy:
    name: Deploy to INT Environment
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # Step 1: Print deployment info
      # ============================================
      - name: Deployment Info
        run: |
          echo "============================================"
          echo "Deploying to INT Environment"
          echo "============================================"
          echo "Image Tag:    ${{ github.event.inputs.image_tag }}"
          echo "Skip Backup:  ${{ github.event.inputs.skip_backup }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "============================================"

      # ============================================
      # Step 2: Checkout code (for reference)
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================
      # Step 3: Authenticate to Google Cloud
      # ============================================
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ============================================
      # Step 4: Set up gcloud CLI
      # ============================================
      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # ============================================
      # Step 5: Verify image exists in registry
      # ============================================
      - name: Verify image exists
        run: |
          echo "Checking if images exist in registry..."

          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          SERVER_REPO="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/cvat-server"
          UI_REPO="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/cvat-ui"

          echo "Looking for tag: ${IMAGE_TAG}"

          # Check server image using tags list (more reliable than describe)
          echo "Checking server image..."
          if ! gcloud artifacts docker tags list "${SERVER_REPO}" --format="value(tag)" | grep -q "^${IMAGE_TAG}$"; then
            echo "::error::Tag '${IMAGE_TAG}' not found for cvat-server"
            echo "Available tags:"
            gcloud artifacts docker tags list "${SERVER_REPO}" --format="table(tag)" --limit=10 || true
            exit 1
          fi
          echo "✓ Server image found: ${SERVER_REPO}:${IMAGE_TAG}"

          # Check UI image
          echo "Checking UI image..."
          if ! gcloud artifacts docker tags list "${UI_REPO}" --format="value(tag)" | grep -q "^${IMAGE_TAG}$"; then
            echo "::error::Tag '${IMAGE_TAG}' not found for cvat-ui"
            echo "Available tags:"
            gcloud artifacts docker tags list "${UI_REPO}" --format="table(tag)" --limit=10 || true
            exit 1
          fi
          echo "✓ UI image found: ${UI_REPO}:${IMAGE_TAG}"

          echo "All images verified!"

      # ============================================
      # Step 6: Deploy to INT VM
      # ============================================
      - name: Deploy to INT VM
        run: |
          # Set variables for the deployment script
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          REGISTRY="${{ env.REGISTRY }}"
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          REPO_NAME="${{ env.REPO_NAME }}"
          DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
          SKIP_BACKUP="${{ github.event.inputs.skip_backup }}"
          GIT_REPO_URL="${{ env.GIT_REPO_URL }}"
          GIT_BRANCH="${{ env.GIT_BRANCH }}"
          CVAT_HOST="${{ secrets.INT_CVAT_HOST }}"

          # SSH to VM and run deployment
          gcloud compute ssh ${{ secrets.INT_VM_NAME }} \
            --zone=${{ secrets.GCP_ZONE }} \
            --tunnel-through-iap \
            --command="
              set -e
              echo '============================================'
              echo 'Starting deployment on INT VM'
              echo '============================================'

              # Configure Docker for Artifact Registry
              echo 'Configuring Docker for Artifact Registry...'
              gcloud auth configure-docker ${REGISTRY} --quiet

              # Check if repo exists, clone or pull
              echo 'Checking repository...'
              DEPLOY_DIR=\"\${HOME}/${DEPLOY_PATH}\"
              echo \"Deploy directory: \${DEPLOY_DIR}\"
              if [ -d \"\${DEPLOY_DIR}\" ]; then
                echo 'Repository exists, pulling latest changes...'
                cd \"\${DEPLOY_DIR}\"
                git fetch origin
                git checkout ${GIT_BRANCH}
                git pull origin ${GIT_BRANCH}
              else
                echo 'Repository does not exist, cloning...'
                git clone -b ${GIT_BRANCH} ${GIT_REPO_URL} \"\${DEPLOY_DIR}\"
                cd \"\${DEPLOY_DIR}\"
              fi

              echo 'Current directory: '\$(pwd)
              echo 'Git branch: '\$(git branch --show-current)

              # Create backup (unless skipped)
              if [ '${SKIP_BACKUP}' != 'true' ]; then
                echo 'Creating backup of current state...'
                BACKUP_TAG=\$(date +%Y%m%d_%H%M%S)
                docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' > /tmp/cvat_backup_\${BACKUP_TAG}.txt 2>/dev/null || true
                echo \"Backup saved to /tmp/cvat_backup_\${BACKUP_TAG}.txt\"
              fi

              # Create .env file with all required variables
              echo 'Creating .env file...'
              echo '# CVAT Environment Configuration' > .env
              echo '# Generated by GitHub Actions deployment' >> .env
              echo 'CVAT_HOST=${CVAT_HOST}' >> .env
              echo 'CVAT_SERVER_IMAGE=${REGISTRY}/${PROJECT_ID}/${REPO_NAME}/cvat-server:${IMAGE_TAG}' >> .env
              echo 'CVAT_UI_IMAGE=${REGISTRY}/${PROJECT_ID}/${REPO_NAME}/cvat-ui:${IMAGE_TAG}' >> .env

              echo '.env file contents:'
              cat .env

              # Set image variables for pulling
              CVAT_SERVER_IMAGE='${REGISTRY}/${PROJECT_ID}/${REPO_NAME}/cvat-server:${IMAGE_TAG}'
              CVAT_UI_IMAGE='${REGISTRY}/${PROJECT_ID}/${REPO_NAME}/cvat-ui:${IMAGE_TAG}'

              echo 'Pulling new images...'
              echo \"  Server: \${CVAT_SERVER_IMAGE}\"
              echo \"  UI:     \${CVAT_UI_IMAGE}\"

              docker pull \${CVAT_SERVER_IMAGE}
              docker pull \${CVAT_UI_IMAGE}

              echo 'Stopping current containers...'
              docker compose -f docker-compose.yml -f docker-compose.int.yml down --remove-orphans || true

              echo 'Starting containers with new images...'
              docker compose -f docker-compose.yml -f docker-compose.int.yml up -d

              echo 'Waiting for services to start...'
              sleep 10

              echo 'Checking container status...'
              docker compose -f docker-compose.yml -f docker-compose.int.yml ps

              echo '============================================'
              echo 'Deployment complete!'
              echo 'Image tag: ${IMAGE_TAG}'
              echo 'CVAT Host: ${CVAT_HOST}'
              echo '============================================'
            "

      # ============================================
      # Step 7: Health check
      # ============================================
      - name: Health Check
        run: |
          echo "Running health check..."

          # Give services more time to fully start
          sleep 20

          # Check if containers are running via SSH
          gcloud compute ssh ${{ secrets.INT_VM_NAME }} \
            --zone=${{ secrets.GCP_ZONE }} \
            --tunnel-through-iap \
            --command="
              cd \"\${HOME}/${{ env.DEPLOY_PATH }}\"

              echo 'Container Status:'
              docker compose -f docker-compose.yml -f docker-compose.int.yml ps

              # Check critical services
              FAILED=0

              for SERVICE in cvat_server cvat_ui cvat_db; do
                STATUS=\$(docker compose -f docker-compose.yml -f docker-compose.int.yml ps \${SERVICE} --format '{{.Status}}' 2>/dev/null || echo 'not found')
                if [[ \"\${STATUS}\" == *'Up'* ]]; then
                  echo \"✓ \${SERVICE}: Running\"
                else
                  echo \"✗ \${SERVICE}: \${STATUS}\"
                  FAILED=1
                fi
              done

              if [ \${FAILED} -eq 1 ]; then
                echo ''
                echo 'Some services failed to start. Check logs with:'
                echo '  docker compose logs <service_name>'
                exit 1
              fi

              echo ''
              echo 'All critical services are running!'
            "

      # ============================================
      # Step 8: Deployment summary
      # ============================================
      - name: Deployment Summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | INT |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ github.event.inputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| VM | \`${{ secrets.INT_VM_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CVAT Host | \`${{ secrets.INT_CVAT_HOST }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Deployed" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/cvat-server:${{ github.event.inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/cvat-ui:${{ github.event.inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
