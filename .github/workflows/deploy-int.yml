# =============================================================================
# INT Workflow: Build and Deploy to INT Environment
# =============================================================================
#
# This workflow builds CVAT images and deploys them to INT for testing.
# Use this BEFORE creating a PR - for PM/annotation team to do pre-check.
#
# Flow:
#   1. Developer works on feature branch
#   2. Manually trigger this workflow -> Build + Deploy to INT
#   3. PM/annotation team tests on INT
#   4. If tests pass -> Create PR to sst-main
#
# Usage:
#   1. Go to Actions tab in GitHub
#   2. Select "Deploy to INT" workflow
#   3. Click "Run workflow"
#   4. Select your branch from dropdown
#   5. Click "Run workflow" button
#
# Prerequisites (GitHub Secrets):
#   - GCP_SA_KEY:      Service Account JSON key
#   - GCP_PROJECT_ID:  GCP Project ID
#   - INT_GCP_ZONE:    INT VM zone (e.g., us-central1-a)
#   - INT_VM_NAME:     INT VM instance name
#   - INT_CVAT_HOST:   CVAT hostname for INT
#
# =============================================================================

