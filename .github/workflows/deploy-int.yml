# =============================================================================
# INT Workflow: Build and Deploy to INT Environment
# =============================================================================
#
# This workflow builds CVAT images and deploys them to INT for testing.
# Use this BEFORE creating a PR - for PM/annotation team to do pre-check.
#
# Flow:
#   1. Developer works on feature branch
#   2. Manually trigger this workflow -> Build + Deploy to INT
#   3. PM/annotation team tests on INT
#   4. If tests pass -> Create PR to sst-main
#
# Usage:
#   1. Go to Actions tab in GitHub
#   2. Select "Deploy to INT" workflow
#   3. Click "Run workflow"
#   4. Select your branch from dropdown
#   5. Click "Run workflow" button
#
# Prerequisites (GitHub Secrets):
#   - GCP_SA_KEY:      Service Account JSON key
#   - GCP_PROJECT_ID:  GCP Project ID
#   - INT_GCP_ZONE:    INT VM zone (e.g., us-central1-a)
#   - INT_VM_NAME:     INT VM instance name
#   - INT_CVAT_HOST:   CVAT hostname for INT
#
# =============================================================================

name: Deploy to INT

on:
  workflow_dispatch:
    inputs:
      skip_backup:
        description: 'Skip backup before deployment'
        required: false
        type: boolean
        default: false

# Prevent duplicate runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: us-central1-docker.pkg.dev
  REPO_NAME: cvat-repo
  DEPLOY_PATH: /tmp/cvat-deploy

jobs:
  # ============================================
  # Job 1: Build Images (reusable workflow)
  # ============================================
  build:
    name: Build Images
    uses: ./.github/workflows/build-images.yml
    with:
      ref: ${{ github.ref }}
      image_tag: ${{ github.ref_name }}-${{ github.sha }}
      push_latest: false
    secrets: inherit

  # ============================================
  # Job 2: Deploy to INT
  # ============================================
  deploy:
    name: Deploy to INT Environment
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Generate short SHA
        id: vars
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH_TAG=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          IMAGE_TAG="${BRANCH_TAG}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "branch_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Deployment Info
        run: |
          echo "============================================"
          echo "Deploying to INT Environment"
          echo "============================================"
          echo "Branch:       ${{ steps.vars.outputs.branch_name }}"
          echo "Image Tag:    ${{ steps.vars.outputs.image_tag }}"
          echo "Skip Backup:  ${{ github.event.inputs.skip_backup }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "============================================"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Prepare deployment files
        id: prepare
        run: |
          IMAGE_TAG="${{ steps.vars.outputs.image_tag }}"
          REGISTRY="${{ env.REGISTRY }}"
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          REPO_NAME="${{ env.REPO_NAME }}"
          CVAT_HOST="${{ secrets.INT_CVAT_HOST }}"

          # Create .env file
          cat > .env << EOF
          # CVAT Environment Configuration
          # Generated by GitHub Actions deployment
          CVAT_HOST=${CVAT_HOST}
          CVAT_SERVER_IMAGE=${REGISTRY}/${PROJECT_ID}/${REPO_NAME}/cvat-server:${IMAGE_TAG}
          CVAT_UI_IMAGE=${REGISTRY}/${PROJECT_ID}/${REPO_NAME}/cvat-ui:${IMAGE_TAG}
          EOF

          echo "Created .env file:"
          cat .env

      - name: Prepare VM deployment directory
        run: |
          # Create deployment directory on VM (clean slate to avoid permission issues)
          gcloud compute ssh ${{ secrets.INT_VM_NAME }} \
            --zone=${{ secrets.INT_GCP_ZONE }} \
            --tunnel-through-iap \
            --command="sudo rm -rf ${{ env.DEPLOY_PATH }} && mkdir -p ${{ env.DEPLOY_PATH }}"

      - name: Copy deployment files to VM
        run: |
          # Copy docker-compose files and .env to VM
          gcloud compute scp \
            docker-compose.yml \
            docker-compose.int.yml \
            .env \
            ${{ secrets.INT_VM_NAME }}:${{ env.DEPLOY_PATH }}/ \
            --zone=${{ secrets.INT_GCP_ZONE }} \
            --tunnel-through-iap

          echo "Deployment files copied to VM:${{ env.DEPLOY_PATH }}/"

      - name: Deploy to INT VM
        run: |
          IMAGE_TAG="${{ steps.vars.outputs.image_tag }}"
          BRANCH_NAME="${{ steps.vars.outputs.branch_name }}"
          REGISTRY="${{ env.REGISTRY }}"
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          REPO_NAME="${{ env.REPO_NAME }}"
          DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
          SKIP_BACKUP="${{ github.event.inputs.skip_backup }}"

          # Get access token on GitHub runner
          ACCESS_TOKEN=$(gcloud auth print-access-token)

          gcloud compute ssh ${{ secrets.INT_VM_NAME }} \
            --zone=${{ secrets.INT_GCP_ZONE }} \
            --tunnel-through-iap \
            --command="
              set -e

              # Force Docker to use project-specific config dir (isolated from other deployments)
              export DOCKER_CONFIG=/tmp/sst-cvat/.docker
              rm -rf \${DOCKER_CONFIG} 2>/dev/null || true
              mkdir -p \${DOCKER_CONFIG}

              echo '============================================'
              echo 'Starting deployment on INT VM'
              echo '============================================'

              # Configure Docker for Artifact Registry
              echo 'Logging into Docker via Access Token...'
              echo '${ACCESS_TOKEN}' | docker login -u oauth2accesstoken --password-stdin https://${REGISTRY}

              cd ${DEPLOY_PATH}

              echo 'Deployment directory: '${DEPLOY_PATH}
              echo ''
              echo 'Files in deployment directory:'
              ls -la

              # Create backup (unless skipped)
              if [ '${SKIP_BACKUP}' != 'true' ]; then
                echo ''
                echo 'Creating backup of current state...'
                BACKUP_TAG=\$(date +%Y%m%d_%H%M%S)
                docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' > /tmp/cvat_backup_\${BACKUP_TAG}.txt 2>/dev/null || true
                echo \"Backup saved to /tmp/cvat_backup_\${BACKUP_TAG}.txt\"
              fi

              echo ''
              echo '.env file contents:'
              cat .env

              # Pull images
              CVAT_SERVER_IMAGE='${REGISTRY}/${PROJECT_ID}/${REPO_NAME}/cvat-server:${IMAGE_TAG}'
              CVAT_UI_IMAGE='${REGISTRY}/${PROJECT_ID}/${REPO_NAME}/cvat-ui:${IMAGE_TAG}'

              echo ''
              echo 'Pulling new images...'
              echo \"  Server: \${CVAT_SERVER_IMAGE}\"
              echo \"  UI:     \${CVAT_UI_IMAGE}\"

              docker pull \${CVAT_SERVER_IMAGE}
              docker pull \${CVAT_UI_IMAGE}

              echo 'Stopping current containers...'
              docker compose -f docker-compose.yml -f docker-compose.int.yml down --remove-orphans || true

              echo 'Starting containers with new images...'
              docker compose -f docker-compose.yml -f docker-compose.int.yml up -d

              echo 'Waiting for services to start...'
              sleep 10

              echo 'Checking container status...'
              docker compose -f docker-compose.yml -f docker-compose.int.yml ps

              echo '============================================'
              echo 'Deployment complete!'
              echo 'Branch:    ${BRANCH_NAME}'
              echo 'Image tag: ${IMAGE_TAG}'
              echo '============================================'
            "

      - name: Health Check
        run: |
          echo "Running health check..."
          sleep 20

          gcloud compute ssh ${{ secrets.INT_VM_NAME }} \
            --zone=${{ secrets.INT_GCP_ZONE }} \
            --tunnel-through-iap \
            --command="
              cd ${{ env.DEPLOY_PATH }}

              echo 'Container Status:'
              docker compose -f docker-compose.yml -f docker-compose.int.yml ps

              FAILED=0

              for SERVICE in cvat_server cvat_ui cvat_db; do
                STATUS=\$(docker compose -f docker-compose.yml -f docker-compose.int.yml ps \${SERVICE} --format '{{.Status}}' 2>/dev/null || echo 'not found')
                if [[ \"\${STATUS}\" == *'Up'* ]]; then
                  echo \"✓ \${SERVICE}: Running\"
                else
                  echo \"✗ \${SERVICE}: \${STATUS}\"
                  FAILED=1
                fi
              done

              if [ \${FAILED} -eq 1 ]; then
                echo ''
                echo 'Some services failed to start. Check logs with:'
                echo '  docker compose logs <service_name>'
                exit 1
              fi

              echo ''
              echo 'All critical services are running!'
            "

      - name: Cleanup OS Login Profile
        if: always()
        run: |
          echo "Cleaning up OS Login profile..."
          gcloud compute os-login remove-profile --quiet || true
          echo "OS Login profile cleaned up."

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | **INT** |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ steps.vars.outputs.branch_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ steps.vars.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| VM | \`${{ secrets.INT_VM_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CVAT Host | \`${{ secrets.INT_CVAT_HOST }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Test on INT environment" >> $GITHUB_STEP_SUMMARY
          echo "2. If tests pass, create PR to \`sst-main\`" >> $GITHUB_STEP_SUMMARY
