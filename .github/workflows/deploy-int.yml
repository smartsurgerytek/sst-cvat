# =============================================================================
# INT Workflow: Build and Deploy to INT Environment
# =============================================================================
#
# This workflow builds CVAT images and deploys them to INT for testing.
# Use this BEFORE creating a PR - for PM/annotation team to do pre-check.
#
# Flow:
#   1. Developer works on feature branch
#   2. Manually trigger this workflow -> Build + Deploy to INT
#   3. PM/annotation team tests on INT
#   4. If tests pass -> Create PR to sst-main
#
# Usage:
#   1. Go to Actions tab in GitHub
#   2. Select "Deploy to INT" workflow
#   3. Click "Run workflow"
#   4. Select your branch from dropdown
#   5. Click "Run workflow" button
#
# Prerequisites (GitHub Secrets):
#   - GCP_SA_KEY:      Service Account JSON key
#   - GCP_PROJECT_ID:  GCP Project ID
#   - INT_GCP_ZONE:    INT VM zone (e.g., us-central1-a)
#   - INT_VM_NAME:     INT VM instance name
#   - INT_CVAT_HOST:   CVAT hostname for INT
#
# =============================================================================


name: deploy-prod-aws.yml

on:
  workflow_dispatch:

jobs:

  # -----------------------------------
  # 1️⃣ Prepare Build Parameters
  # -----------------------------------
  prepare:
    name: Prepare Build Parameters
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="prod-${SHORT_SHA}"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

  # -----------------------------------
  # 2️⃣ Build & Push Images to US ECR
  # -----------------------------------
  build:
    name: Build and Push Images to ECR
    runs-on: ubuntu-latest
    needs: prepare

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR (US-East-1)
        run: |
          aws ecr get-login-password --region us-east-1 \
          | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Build CVAT Server
        run: |
          docker build -t $ECR_REGISTRY/cvat-server:$IMAGE_TAG .

      - name: Build CVAT UI
        run: |
          docker build -t $ECR_REGISTRY/cvat-ui:$IMAGE_TAG ./cvat-ui

      - name: Push CVAT Server
        run: docker push $ECR_REGISTRY/cvat-server:$IMAGE_TAG

      - name: Push CVAT UI
        run: docker push $ECR_REGISTRY/cvat-ui:$IMAGE_TAG

      - name: Build Summary
        run: |
          echo "## Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ref | $GITHUB_REF |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | $IMAGE_TAG |" >> $GITHUB_STEP_SUMMARY
          echo "| Env Label | PROD |" >> $GITHUB_STEP_SUMMARY

  # -----------------------------------
  # 3️⃣ Deploy to Production
  # -----------------------------------
  deploy:
    name: Deploy to PROD Environment
    runs-on: ubuntu-latest
    needs: build

    env:
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/prod_key.pem
          chmod 600 ~/.ssh/prod_key.pem

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/prod_key.pem ubuntu@${{ secrets.PROD_EC2_HOST }} << EOF

          export CVAT_HOST=${{ secrets.PROD_CVAT_HOST }}
          export IMAGE_TAG=${IMAGE_TAG}
          export ECR_REGISTRY=${ECR_REGISTRY}

          cd ~/cvat/sst-cvat

          echo "Login to ECR..."
          aws ecr get-login-password --region us-east-1 \
          | docker login --username AWS --password-stdin \$ECR_REGISTRY

          echo "Pull images..."
          docker pull \$ECR_REGISTRY/cvat-server:\$IMAGE_TAG
          docker pull \$ECR_REGISTRY/cvat-ui:\$IMAGE_TAG

          echo "Restart containers..."
          docker compose down

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.stg.yml \
            -f docker-compose.https.yml \
            -f components/serverless/docker-compose.serverless.yml \
            up -d

          docker compose ps

          EOF