# =============================================================================
# Reusable Workflow: Build and Push CVAT Images
# =============================================================================
#
# This is a reusable workflow that builds and pushes CVAT server and UI images.
# It can be called by other workflows (deploy-int, deploy-stg, pr-build).
#
# Usage:
#   jobs:
#     build:
#       uses: ./.github/workflows/build-images.yml
#       with:
#         ref: ${{ github.ref }}
#         image_tag: "my-tag"
#         push_latest: false
#       secrets: inherit
#
# =============================================================================

name: Build Images

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout (branch, tag, or SHA)'
        required: true
        type: string
      image_tag:
        description: 'Tag for the Docker images'
        required: true
        type: string
      push_latest:
        description: 'Also tag images as "latest"'
        required: false
        type: boolean
        default: false
      env_label:
        description: 'Environment label for UI badge (INT, STG, etc.)'
        required: false
        type: string
        default: ''
    outputs:
      image_tag:
        description: 'The image tag that was used'
        value: ${{ jobs.build.outputs.image_tag }}
      server_image:
        description: 'Full server image path'
        value: ${{ jobs.build.outputs.server_image }}
      ui_image:
        description: 'Full UI image path'
        value: ${{ jobs.build.outputs.ui_image }}

env:
  GCP_REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPO_NAME: cvat-repo

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ inputs.image_tag }}
      server_image: ${{ steps.images.outputs.server_image }}
      ui_image: ${{ steps.images.outputs.ui_image }}

    steps:
      - name: Build Info
        run: |
          echo "============================================"
          echo "Build Parameters"
          echo "============================================"
          echo "Ref:         ${{ inputs.ref }}"
          echo "Image Tag:   ${{ inputs.image_tag }}"
          echo "Push Latest: ${{ inputs.push_latest }}"
          echo "============================================"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set image paths
        id: images
        run: |
          SERVER_IMAGE="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/cvat-server"
          UI_IMAGE="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/cvat-ui"
          echo "server_image=${SERVER_IMAGE}" >> $GITHUB_OUTPUT
          echo "ui_image=${UI_IMAGE}" >> $GITHUB_OUTPUT

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push CVAT Server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.server_image }}:${{ inputs.image_tag }}
            ${{ inputs.push_latest && format('{0}:latest', steps.images.outputs.server_image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push CVAT UI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          push: true
          build-args: |
            CVAT_ENV_LABEL=${{ inputs.env_label }}
          tags: |
            ${{ steps.images.outputs.ui_image }}:${{ inputs.image_tag }}
            ${{ inputs.push_latest && format('{0}:latest', steps.images.outputs.ui_image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Summary
        run: |
          echo "## Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ref | \`${{ inputs.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ inputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Push Latest | \`${{ inputs.push_latest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Pushed" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.images.outputs.server_image }}:${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.images.outputs.ui_image }}:${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.push_latest }}" = "true" ]; then
            echo "${{ steps.images.outputs.server_image }}:latest" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.images.outputs.ui_image }}:latest" >> $GITHUB_STEP_SUMMARY
          fi
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
