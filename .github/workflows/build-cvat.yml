# =============================================================================
# CI Workflow: Build CVAT Images for PR Checks and STG
# =============================================================================
#
# This workflow builds CVAT images for PR validation and STG deployment.
#
# Triggers:
#   - PR to sst-main: Build only (validates Dockerfiles, no push)
#   - Push to sst-main: Build and push for STG deployment (after PR merged)
#
# Flow:
#   1. Developer tests on INT (using build-deploy-int.yml)
#   2. Create PR to sst-main -> This workflow runs (build only, no push)
#   3. PR merged -> This workflow runs (builds and pushes for STG)
#   4. deploy-stg.yml deploys to STG
#
# Tagging Strategy:
#   - sst-main branch (push): "latest" + "sst-main-{short_sha}"
#   - PR builds:              "{branch_name}-{short_sha}"
#
# Prerequisites (GitHub Secrets):
#   - GCP_SA_KEY:      Service Account JSON key
#   - GCP_PROJECT_ID:  GCP Project ID (sandbox-446907)
#
# =============================================================================

name: Build CVAT Images

on:
  # PR trigger - CI checks before merge
  pull_request:
    branches:
      - 'sst-main'

  # Push trigger - build for STG after PR merged
  push:
    branches:
      - 'sst-main'

# Prevent duplicate runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GCP Configuration (VM is in us-central1-a)
  GCP_REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPO_NAME: cvat-repo

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest

    # Only run if secrets are available (skip for external PRs from forks)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      # ============================================
      # Step 1: Checkout the code
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================
      # Step 2: Generate image tags based on branch
      # ============================================
      - name: Generate image tags
        id: tags
        run: |
          # Get short SHA (7 characters)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

          # Determine branch name based on event type
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH_NAME="${{ github.head_ref }}"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          fi

          # Make branch name tag-friendly (replace / with -)
          BRANCH_TAG=$(echo "${BRANCH_NAME}" | sed 's/\//-/g')
          echo "branch_tag=${BRANCH_TAG}" >> $GITHUB_OUTPUT

          # Create the version tag: {branch}-{short_sha}
          VERSION_TAG="${BRANCH_TAG}-${SHORT_SHA}"
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT

          # Push "latest" tag only for push to sst-main (not for PRs)
          if [ "${{ github.event_name }}" = "push" ] && [ "$BRANCH_NAME" = "sst-main" ]; then
            echo "is_main=true" >> $GITHUB_OUTPUT
            echo "::notice::Push to sst-main - will tag as 'latest' for STG"
          else
            echo "is_main=false" >> $GITHUB_OUTPUT
            echo "::notice::PR build from ${BRANCH_NAME}"
          fi

          echo "============================================"
          echo "Event:       ${{ github.event_name }}"
          echo "Branch:      ${BRANCH_NAME}"
          echo "Version Tag: ${VERSION_TAG}"
          echo "============================================"

      # ============================================
      # Step 3: Authenticate to Google Cloud
      # ============================================
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ============================================
      # Step 4: Set up gcloud CLI
      # ============================================
      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # ============================================
      # Step 5: Configure Docker for Artifact Registry
      # ============================================
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }} --quiet
          echo "Docker configured for ${{ env.REGISTRY }}"

      # ============================================
      # Step 6: Set up Docker Buildx (for better caching)
      # ============================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================
      # Step 7: Build and Push CVAT Server Image
      # ============================================
      # PR builds: Build only (validates Dockerfile works)
      # Push to sst-main: Build and push with "latest" tag
      - name: Build and Push CVAT Server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/cvat-server:${{ steps.tags.outputs.version_tag }}
            ${{ steps.tags.outputs.is_main == 'true' && format('{0}/{1}/{2}/cvat-server:latest', env.REGISTRY, secrets.GCP_PROJECT_ID, env.REPO_NAME) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============================================
      # Step 8: Build and Push CVAT UI Image
      # ============================================
      # PR builds: Build only (validates Dockerfile works)
      # Push to sst-main: Build and push with "latest" tag
      - name: Build and Push CVAT UI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/cvat-ui:${{ steps.tags.outputs.version_tag }}
            ${{ steps.tags.outputs.is_main == 'true' && format('{0}/{1}/{2}/cvat-ui:latest', env.REGISTRY, secrets.GCP_PROJECT_ID, env.REPO_NAME) || '' }}
          build-args: |
            CVAT_ENV_LABEL=STG
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============================================
      # Step 9: Summary output
      # ============================================
      - name: Build Summary
        run: |
          echo "## Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Event | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ steps.tags.outputs.branch_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ steps.tags.outputs.short_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "### Images Pushed" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/cvat-server:${{ steps.tags.outputs.version_tag }}" >> $GITHUB_STEP_SUMMARY
            echo "${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/cvat-ui:${{ steps.tags.outputs.version_tag }}" >> $GITHUB_STEP_SUMMARY
            echo "${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/cvat-server:latest" >> $GITHUB_STEP_SUMMARY
            echo "${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/cvat-ui:latest" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Next: STG Deployment" >> $GITHUB_STEP_SUMMARY
            echo "Images tagged as \`latest\` - ready for STG deployment" >> $GITHUB_STEP_SUMMARY
          else
            echo "### PR Build (No Push)" >> $GITHUB_STEP_SUMMARY
            echo "Build validated successfully. Images were **not pushed** to registry." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Merge PR to build and push images for STG deployment." >> $GITHUB_STEP_SUMMARY
          fi
