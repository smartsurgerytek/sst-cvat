# =============================================================================
# INT Workflow: Build and Deploy to INT Environment
# =============================================================================
#
# This workflow builds CVAT images and deploys them to INT for testing.
# Use this BEFORE creating a PR - for PM/annotation team to do pre-check.
#
# Flow:
#   1. Developer works on feature branch
#   2. Manually trigger this workflow → Build + Deploy to INT
#   3. PM/annotation team tests on INT
#   4. If tests pass → Create PR to sst-main
#
# Usage:
#   1. Go to Actions tab in GitHub
#   2. Select "Build and Deploy to INT" workflow
#   3. Click "Run workflow"
#   4. Select your branch from dropdown
#   5. Click "Run workflow" button
#
# Prerequisites (GitHub Secrets):
#   - GCP_SA_KEY:      Service Account JSON key
#   - GCP_PROJECT_ID:  GCP Project ID
#   - INT_GCP_ZONE:    INT VM zone (e.g., us-central1-a)
#   - INT_VM_NAME:     INT VM instance name
#   - INT_CVAT_HOST:   CVAT hostname for INT
#
# =============================================================================

name: Build and Deploy to INT

on:
  workflow_dispatch:
    inputs:
      skip_backup:
        description: 'Skip backup before deployment'
        required: false
        type: boolean
        default: false

# Prevent duplicate runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GCP Configuration
  GCP_REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPO_NAME: cvat-repo

  # Deployment Configuration
  DEPLOY_PATH: sst-cvat
  GIT_REPO_URL: https://github.com/smartsurgerytek/sst-cvat.git

jobs:
  # ============================================
  # Job 1: Build and Push Images
  # ============================================
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tags.outputs.version_tag }}
      branch_name: ${{ steps.tags.outputs.branch_name }}
      short_sha: ${{ steps.tags.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tags
        id: tags
        run: |
          # Get short SHA (7 characters)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

          # Get branch name and make it tag-friendly (replace / with -)
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          BRANCH_TAG=$(echo "${BRANCH_NAME}" | sed 's/\//-/g')
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "branch_tag=${BRANCH_TAG}" >> $GITHUB_OUTPUT

          # Create the version tag: {branch}-{short_sha}
          VERSION_TAG="${BRANCH_TAG}-${SHORT_SHA}"
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT

          echo "============================================"
          echo "Branch:      ${BRANCH_NAME}"
          echo "Version Tag: ${VERSION_TAG}"
          echo "============================================"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push CVAT Server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/cvat-server:${{ steps.tags.outputs.version_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push CVAT UI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          push: true
          tags: ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/cvat-ui:${{ steps.tags.outputs.version_tag }}
          build-args: |
            CVAT_ENV_LABEL=INT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Summary
        run: |
          echo "## Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ steps.tags.outputs.branch_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ steps.tags.outputs.short_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ steps.tags.outputs.version_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/cvat-server:${{ steps.tags.outputs.version_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/cvat-ui:${{ steps.tags.outputs.version_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Job 2: Deploy to INT
  # ============================================
  deploy:
    name: Deploy to INT Environment
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deployment Info
        run: |
          echo "============================================"
          echo "Deploying to INT Environment"
          echo "============================================"
          echo "Branch:       ${{ needs.build.outputs.branch_name }}"
          echo "Image Tag:    ${{ needs.build.outputs.image_tag }}"
          echo "Skip Backup:  ${{ github.event.inputs.skip_backup }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "============================================"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to INT VM
        run: |
          # Set variables for the deployment script
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          BRANCH_NAME="${{ needs.build.outputs.branch_name }}"
          REGISTRY="${{ env.REGISTRY }}"
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          REPO_NAME="${{ env.REPO_NAME }}"
          DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
          SKIP_BACKUP="${{ github.event.inputs.skip_backup }}"
          GIT_REPO_URL="${{ env.GIT_REPO_URL }}"
          CVAT_HOST="${{ secrets.INT_CVAT_HOST }}"

          # SSH to VM and run deployment
          gcloud compute ssh ${{ secrets.INT_VM_NAME }} \
            --zone=${{ secrets.INT_GCP_ZONE }} \
            --tunnel-through-iap \
            --command="
              set -e
              echo '============================================'
              echo 'Starting deployment on INT VM'
              echo '============================================'

              # Configure Docker for Artifact Registry
              echo 'Configuring Docker for Artifact Registry...'
              gcloud auth configure-docker ${REGISTRY} --quiet

              # Check if repo exists, clone or pull
              echo 'Checking repository...'
              DEPLOY_DIR=\"\${HOME}/${DEPLOY_PATH}\"
              echo \"Deploy directory: \${DEPLOY_DIR}\"
              if [ -d \"\${DEPLOY_DIR}\" ]; then
                echo 'Repository exists, syncing with remote...'
                cd \"\${DEPLOY_DIR}\"
                git fetch origin
                git checkout ${BRANCH_NAME} || git checkout -b ${BRANCH_NAME} origin/${BRANCH_NAME}
                git reset --hard origin/${BRANCH_NAME}
              else
                echo 'Repository does not exist, cloning...'
                git clone -b ${BRANCH_NAME} ${GIT_REPO_URL} \"\${DEPLOY_DIR}\"
                cd \"\${DEPLOY_DIR}\"
              fi

              echo 'Current directory: '\$(pwd)
              echo 'Git branch: '\$(git branch --show-current)

              # Create backup (unless skipped)
              if [ '${SKIP_BACKUP}' != 'true' ]; then
                echo 'Creating backup of current state...'
                BACKUP_TAG=\$(date +%Y%m%d_%H%M%S)
                docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' > /tmp/cvat_backup_\${BACKUP_TAG}.txt 2>/dev/null || true
                echo \"Backup saved to /tmp/cvat_backup_\${BACKUP_TAG}.txt\"
              fi

              # Create .env file with all required variables
              echo 'Creating .env file...'
              echo '# CVAT Environment Configuration' > .env
              echo '# Generated by GitHub Actions deployment' >> .env
              echo 'CVAT_HOST=${CVAT_HOST}' >> .env
              echo 'CVAT_SERVER_IMAGE=${REGISTRY}/${PROJECT_ID}/${REPO_NAME}/cvat-server:${IMAGE_TAG}' >> .env
              echo 'CVAT_UI_IMAGE=${REGISTRY}/${PROJECT_ID}/${REPO_NAME}/cvat-ui:${IMAGE_TAG}' >> .env

              echo '.env file contents:'
              cat .env

              # Set image variables for pulling
              CVAT_SERVER_IMAGE='${REGISTRY}/${PROJECT_ID}/${REPO_NAME}/cvat-server:${IMAGE_TAG}'
              CVAT_UI_IMAGE='${REGISTRY}/${PROJECT_ID}/${REPO_NAME}/cvat-ui:${IMAGE_TAG}'

              echo 'Pulling new images...'
              echo \"  Server: \${CVAT_SERVER_IMAGE}\"
              echo \"  UI:     \${CVAT_UI_IMAGE}\"

              docker pull \${CVAT_SERVER_IMAGE}
              docker pull \${CVAT_UI_IMAGE}

              echo 'Stopping current containers...'
              docker compose -f docker-compose.yml -f docker-compose.int.yml down --remove-orphans || true

              echo 'Starting containers with new images...'
              docker compose -f docker-compose.yml -f docker-compose.int.yml up -d

              echo 'Waiting for services to start...'
              sleep 10

              echo 'Checking container status...'
              docker compose -f docker-compose.yml -f docker-compose.int.yml ps

              echo '============================================'
              echo 'Deployment complete!'
              echo 'Branch:    ${BRANCH_NAME}'
              echo 'Image tag: ${IMAGE_TAG}'
              echo 'CVAT Host: ${CVAT_HOST}'
              echo '============================================'
            "

      - name: Health Check
        run: |
          echo "Running health check..."
          sleep 20

          gcloud compute ssh ${{ secrets.INT_VM_NAME }} \
            --zone=${{ secrets.INT_GCP_ZONE }} \
            --tunnel-through-iap \
            --command="
              cd \"\${HOME}/${{ env.DEPLOY_PATH }}\"

              echo 'Container Status:'
              docker compose -f docker-compose.yml -f docker-compose.int.yml ps

              FAILED=0

              for SERVICE in cvat_server cvat_ui cvat_db; do
                STATUS=\$(docker compose -f docker-compose.yml -f docker-compose.int.yml ps \${SERVICE} --format '{{.Status}}' 2>/dev/null || echo 'not found')
                if [[ \"\${STATUS}\" == *'Up'* ]]; then
                  echo \"✓ \${SERVICE}: Running\"
                else
                  echo \"✗ \${SERVICE}: \${STATUS}\"
                  FAILED=1
                fi
              done

              if [ \${FAILED} -eq 1 ]; then
                echo ''
                echo 'Some services failed to start. Check logs with:'
                echo '  docker compose logs <service_name>'
                exit 1
              fi

              echo ''
              echo 'All critical services are running!'
            "

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | **INT** |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ needs.build.outputs.branch_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ needs.build.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| VM | \`${{ secrets.INT_VM_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CVAT Host | \`${{ secrets.INT_CVAT_HOST }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Test on INT environment" >> $GITHUB_STEP_SUMMARY
          echo "2. If tests pass, create PR to \`sst-main\`" >> $GITHUB_STEP_SUMMARY
