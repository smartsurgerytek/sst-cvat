# =============================================================================
# Reusable Workflow: Build and Push CVAT Images to AWS ECR
# =============================================================================
#
# This is a reusable workflow that builds and pushes CVAT server and UI images to AWS ECR.
# It can be called by other workflows (deploy-int-aws, deploy-stg-aws, pr-build-aws).
#
# Usage:
#   jobs:
#     build:
#       uses: ./.github/workflows/build-images-aws.yml
#       with:
#         ref: ${{ github.ref }}
#         image_tag: "my-tag"
#         push_latest: false
#         env_label: "INT"
#       secrets: inherit
#
# =============================================================================

name: Build Images (AWS)

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout (branch, tag, or SHA)'
        required: true
        type: string
      image_tag:
        description: 'Tag for the Docker images'
        required: true
        type: string
      push_latest:
        description: 'Also tag images as "latest"'
        required: false
        type: boolean
        default: false
      env_label:
        description: 'Environment label for UI badge (INT, STG, etc.)'
        required: false
        type: string
        default: ''
    outputs:
      image_tag:
        description: 'The image tag that was used'
        value: ${{ jobs.build.outputs.image_tag }}
      server_image:
        description: 'Full server image path'
        value: ${{ jobs.build.outputs.server_image }}
      ui_image:
        description: 'Full UI image path'
        value: ${{ jobs.build.outputs.ui_image }}

env:
  AWS_REGION: us-east-1
  ECR_REPO_SERVER: cvat-server
  ECR_REPO_UI: cvat-ui

jobs:
  build:
    name: Build and Push Images to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ inputs.image_tag }}
      server_image: ${{ steps.images.outputs.server_image }}
      ui_image: ${{ steps.images.outputs.ui_image }}

    steps:
      - name: Build Info
        run: |
          echo "============================================"
          echo "Build Parameters"
          echo "============================================"
          echo "Ref:         ${{ inputs.ref }}"
          echo "Image Tag:   ${{ inputs.image_tag }}"
          echo "Push Latest: ${{ inputs.push_latest }}"
          echo "Env Label:   ${{ inputs.env_label }}"
          echo "============================================"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set image paths
        id: images
        run: |
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          SERVER_IMAGE="${ECR_REGISTRY}/${{ env.ECR_REPO_SERVER }}"
          UI_IMAGE="${ECR_REGISTRY}/${{ env.ECR_REPO_UI }}"
          echo "server_image=${SERVER_IMAGE}" >> $GITHUB_OUTPUT
          echo "ui_image=${UI_IMAGE}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push CVAT Server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.server_image }}:${{ inputs.image_tag }}
            ${{ inputs.push_latest && format('{0}:latest', steps.images.outputs.server_image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push CVAT UI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ui
          push: true
          build-args: |
            CVAT_ENV_LABEL=${{ inputs.env_label }}
          tags: |
            ${{ steps.images.outputs.ui_image }}:${{ inputs.image_tag }}
            ${{ inputs.push_latest && format('{0}:latest', steps.images.outputs.ui_image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Summary
        run: |
          echo "## Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ref | \`${{ inputs.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ inputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Push Latest | \`${{ inputs.push_latest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Env Label | \`${{ inputs.env_label }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Pushed to ECR" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.images.outputs.server_image }}:${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.images.outputs.ui_image }}:${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.push_latest }}" = "true" ]; then
            echo "${{ steps.images.outputs.server_image }}:latest" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.images.outputs.ui_image }}:latest" >> $GITHUB_STEP_SUMMARY
          fi
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY