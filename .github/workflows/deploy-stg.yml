# =============================================================================
# STG Workflow: Build and Deploy to STG Environment
# =============================================================================
#
# This workflow builds CVAT images and deploys them to STG (Production).
# Triggered automatically when code is merged to sst-main.
#
# Triggers:
#   - Auto: Push to sst-main (after PR merge)
#   - Manual: workflow_dispatch
#
# Prerequisites (GitHub Secrets):
#   - GCP_SA_KEY:      Service Account JSON key
#   - GCP_PROJECT_ID:  GCP Project ID
#   - STG_GCP_ZONE:    STG VM zone (e.g., us-central1-b)
#   - STG_VM_NAME:     STG VM instance name
#   - STG_CVAT_HOST:   CVAT hostname for STG (IP or domain)
#
# =============================================================================

name: Deploy to STG

on:
  # Auto-trigger on push to sst-main (after PR merge)
  push:
    branches:
      - sst-main

  # Manual trigger
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        type: string
        default: 'latest'

# Prevent duplicate runs
concurrency:
  group: ${{ github.workflow }}-stg
  cancel-in-progress: false  # Don't cancel ongoing deployments

env:
  REGISTRY: us-central1-docker.pkg.dev
  REPO_NAME: cvat-repo
  DEPLOY_PATH: sst-cvat
  GIT_REPO_URL: https://github.com/smartsurgerytek/sst-cvat.git

jobs:
  # ============================================
  # Job 1: Build Images (reusable workflow)
  # Only run for push events (not manual with custom tag)
  # ============================================
  build:
    name: Build Images
    if: github.event_name == 'push' || github.event.inputs.image_tag == 'latest'
    uses: ./.github/workflows/build-images.yml
    with:
      ref: sst-main
      image_tag: sst-main-${{ github.sha }}
      push_latest: true
    secrets: inherit

  # ============================================
  # Job 2: Deploy to STG
  # ============================================
  deploy:
    name: Deploy to STG Environment
    runs-on: ubuntu-latest
    needs: build
    # Run even if build was skipped (manual trigger with custom tag)
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')

    steps:
      - name: Determine image tag
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.image_tag }}" != "latest" ]; then
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          else
            IMAGE_TAG="latest"
          fi

          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

          echo "============================================"
          echo "Deployment Parameters"
          echo "============================================"
          echo "Event:        ${{ github.event_name }}"
          echo "Image Tag:    ${IMAGE_TAG}"
          echo "Triggered by: ${{ github.actor }}"
          echo "============================================"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: sst-main

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to STG VM
        run: |
          IMAGE_TAG="${{ steps.params.outputs.image_tag }}"
          REGISTRY="${{ env.REGISTRY }}"
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          REPO_NAME="${{ env.REPO_NAME }}"
          DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
          GIT_REPO_URL="${{ env.GIT_REPO_URL }}"
          CVAT_HOST="${{ secrets.STG_CVAT_HOST }}"

          gcloud compute ssh ${{ secrets.STG_VM_NAME }} \
            --zone=${{ secrets.STG_GCP_ZONE }} \
            --tunnel-through-iap \
            --command="
              set -e
              echo '============================================'
              echo 'Deploying to STG Environment'
              echo '============================================'

              # Configure Docker for Artifact Registry
              echo 'Configuring Docker for Artifact Registry...'
              export CLOUDSDK_CONFIG=/tmp/gcloud-config
              gcloud auth configure-docker ${REGISTRY} --quiet

              # Check if repo exists, clone or pull
              echo 'Checking repository...'
              DEPLOY_DIR=\"\${HOME}/${DEPLOY_PATH}\"
              echo \"Deploy directory: \${DEPLOY_DIR}\"

              if [ -d \"\${DEPLOY_DIR}\" ]; then
                echo 'Repository exists, pulling latest changes...'
                cd \"\${DEPLOY_DIR}\"
                git fetch origin
                git checkout sst-main || git checkout -b sst-main origin/sst-main
                git pull origin sst-main
              else
                echo 'Repository does not exist, cloning...'
                git clone -b sst-main ${GIT_REPO_URL} \"\${DEPLOY_DIR}\"
                cd \"\${DEPLOY_DIR}\"
              fi

              echo 'Current directory: '\$(pwd)
              echo 'Git branch: '\$(git branch --show-current)

              # Show current running containers
              echo ''
              echo 'Current running containers:'
              docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' 2>/dev/null || echo 'No containers running'
              echo ''

              # Create .env file
              echo 'Creating .env file...'
              echo '# CVAT Environment Configuration' > .env
              echo '# Generated by GitHub Actions deployment' >> .env
              echo 'CVAT_HOST=${CVAT_HOST}' >> .env
              echo 'CVAT_SERVER_IMAGE=${REGISTRY}/${PROJECT_ID}/${REPO_NAME}/cvat-server:${IMAGE_TAG}' >> .env
              echo 'CVAT_UI_IMAGE=${REGISTRY}/${PROJECT_ID}/${REPO_NAME}/cvat-ui:${IMAGE_TAG}' >> .env

              echo '.env file contents:'
              cat .env

              # Pull images
              CVAT_SERVER_IMAGE='${REGISTRY}/${PROJECT_ID}/${REPO_NAME}/cvat-server:${IMAGE_TAG}'
              CVAT_UI_IMAGE='${REGISTRY}/${PROJECT_ID}/${REPO_NAME}/cvat-ui:${IMAGE_TAG}'

              echo ''
              echo 'Pulling new images...'
              echo \"  Server: \${CVAT_SERVER_IMAGE}\"
              echo \"  UI:     \${CVAT_UI_IMAGE}\"

              docker pull \${CVAT_SERVER_IMAGE}
              docker pull \${CVAT_UI_IMAGE}

              echo ''
              echo 'Images pulled successfully!'

              # Deploy
              echo ''
              echo 'Stopping current containers...'
              docker compose -f docker-compose.yml -f docker-compose.stg.yml down --remove-orphans || true

              echo 'Starting containers with new images...'
              docker compose -f docker-compose.yml -f docker-compose.stg.yml up -d

              echo 'Waiting for services to start...'
              sleep 10

              echo 'Checking container status...'
              docker compose -f docker-compose.yml -f docker-compose.stg.yml ps

              echo '============================================'
              echo 'Deployment complete!'
              echo 'Image tag: ${IMAGE_TAG}'
              echo 'CVAT Host: ${CVAT_HOST}'
              echo '============================================'
            "

      - name: Health Check
        run: |
          echo "Running health check..."
          sleep 20

          gcloud compute ssh ${{ secrets.STG_VM_NAME }} \
            --zone=${{ secrets.STG_GCP_ZONE }} \
            --tunnel-through-iap \
            --command="
              cd \"\${HOME}/${{ env.DEPLOY_PATH }}\"

              echo 'Container Status:'
              docker compose -f docker-compose.yml -f docker-compose.stg.yml ps

              FAILED=0

              for SERVICE in cvat_server cvat_ui cvat_db; do
                STATUS=\$(docker compose -f docker-compose.yml -f docker-compose.stg.yml ps \${SERVICE} --format '{{.Status}}' 2>/dev/null || echo 'not found')
                if [[ \"\${STATUS}\" == *'Up'* ]]; then
                  echo \"✓ \${SERVICE}: Running\"
                else
                  echo \"✗ \${SERVICE}: \${STATUS}\"
                  FAILED=1
                fi
              done

              if [ \${FAILED} -eq 1 ]; then
                echo ''
                echo 'Some services failed to start. Check logs with:'
                echo '  docker compose logs <service_name>'
                exit 1
              fi

              echo ''
              echo 'All critical services are running!'
            "

      - name: Cleanup OS Login Profile
        if: always()
        run: |
          echo "Cleaning up OS Login profile..."
          gcloud compute os-login remove-profile --quiet || true
          echo "OS Login profile cleaned up."

      - name: Deployment Summary
        if: always()
        run: |
          echo "## STG Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | **STG** |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ steps.params.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| VM | \`${{ secrets.STG_VM_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CVAT Host | \`${{ secrets.STG_CVAT_HOST }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
