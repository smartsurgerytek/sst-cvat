# =============================================================================
# STG Workflow: Build and Deploy to AWS STG Environment
# =============================================================================
#
# This workflow builds CVAT images and deploys them to AWS STG for testing.
# Triggered manually for testing, will be auto-triggered on PR merge later.
#
# Flow:
#   1. Developer creates PR to sst-main
#   2. After PR approval and merge to sst-main
#   3. This workflow auto-builds and deploys to STG
#   4. Team tests on STG before production deployment
#
# Usage (Manual Testing):
#   1. Go to Actions tab in GitHub
#   2. Select "Deploy to STG" workflow
#   3. Click "Run workflow"
#   4. Select your branch from dropdown
#   5. Click "Run workflow" button
#
# Prerequisites (GitHub Secrets):
#   - AWS_ACCESS_KEY_ID:     AWS access key
#   - AWS_SECRET_ACCESS_KEY: AWS secret key
#   - AWS_ACCOUNT_ID:        AWS account ID (587128718062)
#   - STG_EC2_HOST:          STG EC2 domain (cvat-stg.getsmartsurgery.net)
#   - STG_SSH_KEY:           SSH private key for STG EC2 access
#
# =============================================================================

name: Deploy to STG

on:
  # Manual trigger (for testing)
  workflow_dispatch:
    inputs:
      skip_backup:
        description: 'Skip backup before deployment'
        required: false
        type: boolean
        default: false

  # Auto-trigger on push to sst-main (enable this later after testing)
  # push:
  #   branches:
  #     - sst-main

# Prevent duplicate runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  DEPLOY_PATH: /home/ubuntu/cvat/sst-cvat

jobs:
  # ============================================
  # Job 1: Prepare Build Parameters
  # ============================================
  prepare:
    name: Prepare Build Parameters
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Generate image tag with short SHA
        id: vars
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH_TAG=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          IMAGE_TAG="${BRANCH_TAG}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

  # ============================================
  # Job 2: Build Images (reusable workflow)
  # ============================================
  build:
    name: Build Images
    needs: prepare
    uses: ./.github/workflows/build-images-aws.yml
    with:
      ref: ${{ github.ref }}
      image_tag: ${{ needs.prepare.outputs.image_tag }}
      push_latest: false
      env_label: STG
    secrets: inherit

  # ============================================
  # Job 3: Deploy to AWS STG
  # ============================================
  deploy:
    name: Deploy to STG Environment
    runs-on: ubuntu-latest
    needs: [prepare, build]

    steps:
      - name: Set deployment variables
        id: vars
        run: |
          echo "image_tag=${{ needs.prepare.outputs.image_tag }}" >> $GITHUB_OUTPUT
          echo "branch_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Deployment Info
        run: |
          echo "============================================"
          echo "Deploying to AWS STG Environment"
          echo "============================================"
          echo "Branch:       ${{ steps.vars.outputs.branch_name }}"
          echo "Image Tag:    ${{ steps.vars.outputs.image_tag }}"
          echo "Skip Backup:  ${{ github.event.inputs.skip_backup }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "============================================"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Use printf to preserve multiline SSH key correctly
          printf "%s" "${{ secrets.STG_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Add host key (non-fatal if it fails)
          ssh-keyscan -H "${{ secrets.STG_EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Prepare deployment files
        id: prepare
        run: |
          IMAGE_TAG="${{ steps.vars.outputs.image_tag }}"
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          CVAT_HOST="cvat-stg.getsmartsurgery.net"

          # Create .env file
          cat > .env << EOF
          # CVAT Environment Configuration
          # Generated by GitHub Actions deployment
          CVAT_HOST=${CVAT_HOST}
          CVAT_SERVER_IMAGE=${ECR_REGISTRY}/cvat-server:${IMAGE_TAG}
          CVAT_UI_IMAGE=${ECR_REGISTRY}/cvat-ui:${IMAGE_TAG}
          ACME_EMAIL=krishtopher.rathod@faciletechnolab.com
          EOF

          echo "Created .env file:"
          cat .env

      - name: Copy deployment files to EC2
        run: |
          # Copy docker-compose files and .env to EC2
          scp -i ~/.ssh/id_rsa \
            docker-compose.yml \
            docker-compose.stg.yml \
            docker-compose.https.yml \
            .env \
            ubuntu@${{ secrets.STG_EC2_HOST }}:${{ env.DEPLOY_PATH }}/

          # Copy components directory (contains config files mounted by docker-compose)
          scp -r -i ~/.ssh/id_rsa \
            components \
            ubuntu@${{ secrets.STG_EC2_HOST }}:${{ env.DEPLOY_PATH }}/

          echo "Deployment files copied to EC2:${{ env.DEPLOY_PATH }}/"

      - name: Deploy to STG EC2
        run: |
          IMAGE_TAG="${{ steps.vars.outputs.image_tag }}"
          BRANCH_NAME="${{ steps.vars.outputs.branch_name }}"
          DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
          SKIP_BACKUP="${{ github.event.inputs.skip_backup }}"
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"

          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.STG_EC2_HOST }} << ENDSSH
            set -e

            echo '============================================'
            echo 'Starting deployment on AWS STG EC2'
            echo '============================================'

            # Configure AWS CLI for ECR login
            export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
            export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            export AWS_DEFAULT_REGION="${{ env.AWS_REGION }}"

            # Login to ECR
            echo 'Logging into Amazon ECR...'
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${ECR_REGISTRY}

            cd ${DEPLOY_PATH}

            echo 'Deployment directory: ${DEPLOY_PATH}'
            echo ''
            echo 'Files in deployment directory:'
            ls -la

            # Create backup (unless skipped)
            if [ '${SKIP_BACKUP}' != 'true' ]; then
              echo ''
              echo 'Creating backup of current state...'
              BACKUP_TAG=\$(date +%Y%m%d_%H%M%S)
              docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' > /tmp/cvat_backup_\${BACKUP_TAG}.txt 2>/dev/null || true
              echo "Backup saved to /tmp/cvat_backup_\${BACKUP_TAG}.txt"
            fi

            echo ''
            echo '.env file contents:'
            cat .env

            # Source .env to get image names
            export \$(cat .env | grep -v '^#' | xargs)

            echo ''
            echo 'Pulling new images...'
            echo "  Server: \${CVAT_SERVER_IMAGE}"
            echo "  UI:     \${CVAT_UI_IMAGE}"

            docker pull \${CVAT_SERVER_IMAGE}
            docker pull \${CVAT_UI_IMAGE}

            echo 'Stopping current containers...'
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.stg.yml \
              -f docker-compose.https.yml \
              -f components/serverless/docker-compose.serverless.yml \
              down --remove-orphans || true

            echo 'Starting containers with new images (with HTTPS and serverless support)...'
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.stg.yml \
              -f docker-compose.https.yml \
              -f components/serverless/docker-compose.serverless.yml \
              up -d

            echo 'Waiting for services to start...'
            sleep 15

            echo 'Checking container status...'
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.stg.yml \
              -f docker-compose.https.yml \
              -f components/serverless/docker-compose.serverless.yml \
              ps

            echo '============================================'
            echo 'Deployment complete!'
            echo 'Branch:    ${BRANCH_NAME}'
            echo 'Image tag: ${IMAGE_TAG}'
            echo '============================================'
          ENDSSH

      - name: Health Check
        run: |
          echo "Running health check..."
          sleep 20

          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.STG_EC2_HOST }} << 'ENDSSH'
            cd ${{ env.DEPLOY_PATH }}

            echo 'Container Status:'
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.stg.yml \
              -f docker-compose.https.yml \
              -f components/serverless/docker-compose.serverless.yml \
              ps

            FAILED=0

            for SERVICE in cvat_server cvat_ui cvat_db nuclio traefik; do
              STATUS=$(docker compose \
                -f docker-compose.yml \
                -f docker-compose.stg.yml \
                -f docker-compose.https.yml \
                -f components/serverless/docker-compose.serverless.yml \
                ps ${SERVICE} --format '{{.Status}}' 2>/dev/null || echo 'not found')

              if [[ "${STATUS}" == *'Up'* ]]; then
                echo "✓ ${SERVICE}: Running"
              else
                echo "✗ ${SERVICE}: ${STATUS}"
                FAILED=1
              fi
            done

            if [ ${FAILED} -eq 1 ]; then
              echo ''
              echo 'Some services failed to start. Check logs with:'
              echo '  docker compose logs <service_name>'
              exit 1
            fi

            echo ''
            echo 'All critical services are running!'
          ENDSSH

      - name: Cleanup SSH keys
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | **STG (AWS)** |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ steps.vars.outputs.branch_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ steps.vars.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| EC2 Host | \`${{ secrets.STG_EC2_HOST }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CVAT URL | https://cvat-stg.getsmartsurgery.net |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Test on STG environment: https://cvat-stg.getsmartsurgery.net" >> $GITHUB_STEP_SUMMARY
          echo "2. If tests pass, deploy to Production" >> $GITHUB_STEP_SUMMARY